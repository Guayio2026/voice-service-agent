# Deploy nginx site for voice-service-agent.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/zh.conf
#          sudo ln -s /etc/nginx/sites-available/zh.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Security model: Python services stay bound to 127.0.0.1 (LOCAL_ONLY design
# is preserved). nginx is the only public entry; basic auth gates everything.
# HTTP only until a domain + certificate exists; see docs/deploy-cloud.txt.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    auth_basic "zh team";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Mock business API (src/server.py, port 8765).
    # Host/Origin are rewritten because both services whitelist loopback only;
    # MOCK_ORIGINS in mock-business.service must match the Origin below.
    location ~ ^/(health|cases|start_session|verify_identity|get_application|save_call_result|get_results|create_handoff|get_operation_status)$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin http://127.0.0.1:8766;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Voice API + WebSocket ASR (src/voice_server.py, port 8766).
    location /api/ {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 127.0.0.1:8766;
        proxy_set_header Origin http://127.0.0.1:8766;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Static frontend and any other route are served by voice_server itself,
    # keeping its path-traversal whitelist as the single security layer.
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host 127.0.0.1:8766;
        proxy_set_header Origin http://127.0.0.1:8766;
    }
}
